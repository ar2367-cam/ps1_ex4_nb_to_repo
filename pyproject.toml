[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "titanic"
version = "0.1.0"
description = "Titanic data exploration and baseline model"
requires-python = ">=3.13"
dependencies = [
    "pandas",
    "scikit-learn",
    "matplotlib",
    "seaborn",
]

[tool.setuptools]
packages = ["titanic"]
